<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" width="100%" height="100%">
  <defs>
    <!-- Official Palette Gradients -->
    <linearGradient id="swarrnimCyanHand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0097D7"/>
      <stop offset="100%" stop-color="#0B5394"/>
    </linearGradient>
    <linearGradient id="swarrnimNavyHand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2C59"/>
      <stop offset="100%" stop-color="#071325"/>
    </linearGradient>
    <linearGradient id="swarrnimGoldPetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#F5A623"/>
    </linearGradient>
    <linearGradient id="swarrnimOrangePetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9800"/>
      <stop offset="100%" stop-color="#F37023"/>
    </linearGradient>
    <linearGradient id="swarrnimMagentaPetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC407A"/>
      <stop offset="100%" stop-color="#D81B60"/>
    </linearGradient>
    <linearGradient id="swarrnimCyanPetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B0FF"/>
      <stop offset="100%" stop-color="#0097D7"/>
    </linearGradient>
    <linearGradient id="swarrnimGreenPetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8BC34A"/>
      <stop offset="100%" stop-color="#689F38"/>
    </linearGradient>
  </defs>

  <!-- Left Emblem: Blooming Lotus with Supporting Hands -->
  <g transform="translate(10, 5)">
    <!-- Base Supporting Hands (Cyan to Deep Blue Cupped Palms) -->
    <!-- Left Hand -->
    <path d="M 10 92 C 22 122, 68 126, 72 126 C 75 126, 70 108, 55 94 C 38 78, 22 76, 10 92 Z" fill="url(#swarrnimCyanHand)" />
    <path d="M 8 98 C 22 118, 56 122, 70 122 C 55 106, 36 94, 20 88 Z" fill="url(#swarrnimNavyHand)" opacity="0.85" />
    
    <!-- Right Hand -->
    <path d="M 134 92 C 122 122, 76 126, 72 126 C 69 126, 74 108, 89 94 C 106 78, 122 76, 134 92 Z" fill="url(#swarrnimCyanHand)" />
    <path d="M 136 98 C 122 118, 88 122, 74 122 C 89 106, 108 94, 124 88 Z" fill="url(#swarrnimNavyHand)" opacity="0.85" />

    <!-- Lotus Petal Array (Layered Translucent Lotus) -->
    <!-- Outer Side Leaves (Lime Green) -->
    <path d="M 18 54 Q 6 42 22 30 Q 36 40 18 54 Z" fill="url(#swarrnimGreenPetal)" opacity="0.9" />
    <path d="M 126 54 Q 138 42 122 30 Q 108 40 126 54 Z" fill="url(#swarrnimGreenPetal)" opacity="0.9" />

    <!-- Upper Side Petals (Ocean Cyan) -->
    <path d="M 32 46 Q 22 28 38 18 Q 50 32 32 46 Z" fill="url(#swarrnimCyanPetal)" opacity="0.88" />
    <path d="M 112 46 Q 122 28 106 18 Q 94 32 112 46 Z" fill="url(#swarrnimCyanPetal)" opacity="0.88" />

    <!-- Upper Inner Petals (Magenta / Pink) -->
    <path d="M 46 38 Q 38 18 52 10 Q 62 26 46 38 Z" fill="url(#swarrnimMagentaPetal)" opacity="0.9" />
    <path d="M 98 38 Q 106 18 92 10 Q 82 26 98 38 Z" fill="url(#swarrnimMagentaPetal)" opacity="0.9" />

    <!-- Lower Wing Petals (Flame Orange) -->
    <path d="M 28 72 Q 14 56 34 46 Q 48 62 28 72 Z" fill="url(#swarrnimOrangePetal)" opacity="0.92" />
    <path d="M 116 72 Q 130 56 110 46 Q 96 62 116 72 Z" fill="url(#swarrnimOrangePetal)" opacity="0.92" />

    <!-- Middle Inner Petals (Warm Gold / Orange) -->
    <path d="M 44 64 Q 32 45 52 35 Q 64 54 44 64 Z" fill="url(#swarrnimOrangePetal)" />
    <path d="M 100 64 Q 112 45 92 35 Q 80 54 100 64 Z" fill="url(#swarrnimOrangePetal)" />

    <!-- Center Top Flame Petal (Golden Amber) -->
    <path d="M 72 2 C 84 20, 86 42, 72 74 C 58 42, 60 20, 72 2 Z" fill="url(#swarrnimGoldPetal)" />
    <path d="M 72 22 C 78 36, 80 48, 72 68 C 64 48, 66 36, 72 22 Z" fill="url(#swarrnimOrangePetal)" opacity="0.6" />
  </g>

  <!-- Right Typography Stack -->
  <g transform="translate(162, 0)">
    <!-- Line 1: SWARЯNIM -->
    <text x="0" y="38" font-family="'Times New Roman', Georgia, serif" font-weight="900" font-size="36" letter-spacing="2.5" fill="#E58A1F">
      SWAR<tspan font-size="34" dx="1" fill="#E58A1F">Я</tspan>NIM
    </text>

    <!-- Line 2: STARTUP & INNOVATION -->
    <text x="1" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="16" letter-spacing="3.2" fill="#0097D7">
      STARTUP &amp; INNOVATION
    </text>

    <!-- Line 3: U N I V E R S I T Y -->
    <text x="1" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" letter-spacing="7" fill="#0F2C59">
      UNIVERSITY
    </text>

    <!-- Line 4: WHERE IDEAS COME ALIVE. -->
    <text x="2" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11.5" letter-spacing="2" fill="#E58A1F">
      WHERE IDEAS COME ALIVE.
    </text>
  </g>
</svg>
